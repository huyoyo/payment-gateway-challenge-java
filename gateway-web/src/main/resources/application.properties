server.port=8090
spring.application.name=payment-gateway

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml

# Keep public validation messages in English regardless of server locale.
spring.web.locale=en
spring.web.locale-resolver=fixed

# Bank connector routing id; the request body's bankId selects the connector.
connector.bank.simulator.bank-id=${BANK_ID:bank-simulator}
connector.bank.simulator.base-url=${BANK_BASE_URL:${BANK_SIMULATOR_URL:http://localhost:8080}}
connector.bank.simulator.connect-timeout=2s
connector.bank.simulator.read-timeout=3s

# Challenge requirement: amount must be an integer. Reject 100.5 instead of truncating it.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.default-property-inclusion=non_null

# Liveness/readiness probes for a container platform.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Payment Gateway API
info.app.version=0.0.1-SNAPSHOT

# Do not leak internals through the default error page.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Correlation id populated by RequestIdFilter.
logging.pattern.level=%5p [%X{requestId:-}]
