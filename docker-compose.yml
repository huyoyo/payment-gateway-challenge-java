services:
  bank-simulator:
    container_name: bank_simulator
    image: docker.xuanyuan.run/bbyars/mountebank:beta
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  gateway:
    container_name: payment_gateway
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      BANK_BASE_URL: "http://bank-simulator:8080"
    depends_on:
      - bank-simulator
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
